<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>H5 超级玛丽</title>
  <style>
    :root {
      --bg: #7ad7ff;
      --ground: #8f5a2b;
      --brick: #c04f1e;
      --coin: #ffd54f;
      --text: #ffffff;
      --ui: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(#82dcff, #6ac8ff 70%, #58b8ef);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .game-wrap {
      width: min(100%, 980px);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(3px);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 3px solid rgba(255, 255, 255, 0.5);
      background: var(--bg);
      image-rendering: pixelated;
    }

    .hud {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .tips {
      margin-top: 8px;
      opacity: 0.95;
      font-size: 14px;
      line-height: 1.6;
    }

    .touch-controls {
      margin-top: 12px;
      display: none;
      gap: 10px;
      justify-content: space-between;
    }

    .touch-group { display: flex; gap: 10px; }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: var(--ui);
      min-width: 64px;
      min-height: 56px;
      touch-action: none;
      user-select: none;
    }

    .btn:active { transform: scale(0.96); }

    @media (max-width: 900px), (pointer: coarse) {
      .touch-controls { display: flex; }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" width="960" height="540" aria-label="超级玛丽游戏画布"></canvas>
    <div class="hud">
      <div id="score">分数：0</div>
      <div id="coins">金币：0</div>
      <div id="lives">生命：3</div>
      <div id="stage">关卡：1-1</div>
    </div>
    <div class="tips">键盘：A/D 或 ←/→ 移动，W/空格/↑ 跳跃。移动端可用下方按钮控制。</div>

    <div class="touch-controls">
      <div class="touch-group">
        <button class="btn" data-key="left">◀</button>
        <button class="btn" data-key="right">▶</button>
      </div>
      <div class="touch-group">
        <button class="btn" data-key="jump">跳跃</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const hud = {
      score: document.getElementById('score'),
      coins: document.getElementById('coins'),
      lives: document.getElementById('lives'),
      stage: document.getElementById('stage')
    };

    const world = {
      gravity: 0.8,
      width: 5000,
      height: canvas.height,
      floorY: 460,
      flagX: 4700
    };

    const state = {
      score: 0,
      coins: 0,
      lives: 3,
      stage: '1-1',
      gameOver: false,
      win: false,
      cameraX: 0
    };

    const player = {
      x: 100,
      y: world.floorY - 54,
      w: 36,
      h: 54,
      vx: 0,
      vy: 0,
      speed: 4.2,
      jump: 16.5,
      onGround: false,
      invincible: 0,
      color: '#d32f2f'
    };

    const keys = { left: false, right: false, jump: false };

    const platforms = [
      { x: 320, y: 390, w: 150, h: 22, type: 'brick' },
      { x: 600, y: 340, w: 130, h: 22, type: 'brick' },
      { x: 980, y: 370, w: 220, h: 22, type: 'brick' },
      { x: 1400, y: 310, w: 170, h: 22, type: 'brick' },
      { x: 1820, y: 360, w: 190, h: 22, type: 'brick' },
      { x: 2280, y: 300, w: 170, h: 22, type: 'brick' },
      { x: 2700, y: 360, w: 250, h: 22, type: 'brick' },
      { x: 3250, y: 320, w: 180, h: 22, type: 'brick' },
      { x: 3700, y: 350, w: 200, h: 22, type: 'brick' },
      { x: 4120, y: 300, w: 220, h: 22, type: 'brick' }
    ];

    const pits = [
      { x: 760, w: 120 },
      { x: 1600, w: 140 },
      { x: 2980, w: 130 },
      { x: 4380, w: 150 }
    ];

    const coins = [
      ...Array.from({ length: 6 }, (_, i) => ({ x: 350 + i * 42, y: 340, got: false })),
      ...Array.from({ length: 5 }, (_, i) => ({ x: 1020 + i * 46, y: 320, got: false })),
      ...Array.from({ length: 4 }, (_, i) => ({ x: 1860 + i * 50, y: 320, got: false })),
      ...Array.from({ length: 8 }, (_, i) => ({ x: 3260 + i * 48, y: 280, got: false }))
    ];

    const enemies = [
      { x: 520, y: world.floorY - 32, w: 34, h: 32, vx: -1.2, alive: true },
      { x: 1240, y: world.floorY - 32, w: 34, h: 32, vx: -1.1, alive: true },
      { x: 2140, y: world.floorY - 32, w: 34, h: 32, vx: -1.4, alive: true },
      { x: 3500, y: world.floorY - 32, w: 34, h: 32, vx: -1.3, alive: true }
    ];

    function resetPlayer(full = false) {
      player.x = 100;
      player.y = world.floorY - player.h;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.invincible = 120;
      state.cameraX = 0;
      if (full) {
        state.score = 0;
        state.coins = 0;
        state.lives = 3;
        state.gameOver = false;
        state.win = false;
        coins.forEach(c => c.got = false);
        enemies.forEach(e => e.alive = true);
      }
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function intersects(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function takeDamage() {
      if (player.invincible > 0 || state.gameOver || state.win) return;
      state.lives -= 1;
      if (state.lives <= 0) {
        state.gameOver = true;
      } else {
        player.invincible = 140;
        player.x = Math.max(40, player.x - 120);
        player.y = world.floorY - player.h;
        player.vx = 0;
        player.vy = -8;
      }
    }

    function update() {
      if (state.gameOver || state.win) return;

      if (keys.left) player.vx = -player.speed;
      else if (keys.right) player.vx = player.speed;
      else player.vx *= 0.7;

      if (keys.jump && player.onGround) {
        player.vy = -player.jump;
        player.onGround = false;
      }

      player.vy += world.gravity;
      player.x += player.vx;
      player.y += player.vy;
      player.onGround = false;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > world.width) player.x = world.width - player.w;

      const onPit = pits.some(p => player.x + player.w * 0.7 > p.x && player.x + player.w * 0.3 < p.x + p.w);
      if (player.y + player.h >= world.floorY && !onPit) {
        player.y = world.floorY - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      for (const plat of platforms) {
        if (player.x + player.w > plat.x && player.x < plat.x + plat.w) {
          const prevBottom = player.y + player.h - player.vy;
          const currBottom = player.y + player.h;
          if (prevBottom <= plat.y && currBottom >= plat.y && player.vy >= 0) {
            player.y = plat.y - player.h;
            player.vy = 0;
            player.onGround = true;
          }
        }
      }

      if (player.y > canvas.height + 80) {
        takeDamage();
        player.x = Math.max(100, player.x - 100);
        player.y = world.floorY - player.h;
      }

      for (const coin of coins) {
        if (!coin.got && intersects(player, { x: coin.x - 10, y: coin.y - 10, w: 20, h: 20 })) {
          coin.got = true;
          state.coins += 1;
          state.score += 100;
          if (state.coins % 20 === 0) state.lives += 1;
        }
      }

      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        enemy.x += enemy.vx;
        if (enemy.x < 40 || enemy.x > world.width - 60) enemy.vx *= -1;
        for (const pit of pits) {
          if (enemy.x > pit.x - 15 && enemy.x < pit.x + pit.w + 15) enemy.vx *= -1;
        }

        if (intersects(player, enemy)) {
          const stomp = player.vy > 1 && player.y + player.h - enemy.y < 20;
          if (stomp) {
            enemy.alive = false;
            player.vy = -10;
            state.score += 250;
          } else {
            takeDamage();
          }
        }
      }

      if (player.invincible > 0) player.invincible -= 1;

      if (player.x + player.w >= world.flagX) {
        state.win = true;
        state.score += 1000;
      }

      state.cameraX = clamp(player.x - canvas.width * 0.34, 0, world.width - canvas.width);
      updateHUD();
    }

    function drawCloud(x, y) {
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.arc(x + 18, y - 8, 20, 0, Math.PI * 2);
      ctx.arc(x + 40, y, 18, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
    }

    function drawBackground(camX) {
      ctx.fillStyle = '#7ad7ff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const hills = [
        { x: 140, h: 80, w: 220 },
        { x: 620, h: 65, w: 180 },
        { x: 1180, h: 90, w: 250 },
        { x: 1780, h: 75, w: 210 },
        { x: 2550, h: 85, w: 230 },
        { x: 3300, h: 68, w: 180 },
        { x: 4060, h: 95, w: 270 }
      ];

      ctx.fillStyle = '#66bb6a';
      for (const hill of hills) {
        const x = hill.x - camX;
        ctx.beginPath();
        ctx.moveTo(x, world.floorY);
        ctx.quadraticCurveTo(x + hill.w / 2, world.floorY - hill.h, x + hill.w, world.floorY);
        ctx.closePath();
        ctx.fill();
      }

      drawCloud(120 - camX * 0.3, 90);
      drawCloud(500 - camX * 0.25, 130);
      drawCloud(880 - camX * 0.28, 84);
    }

    function draw() {
      drawBackground(state.cameraX);

      ctx.fillStyle = '#8f5a2b';
      ctx.fillRect(0, world.floorY, canvas.width, canvas.height - world.floorY);

      for (const pit of pits) {
        const x = pit.x - state.cameraX;
        ctx.fillStyle = '#111';
        ctx.fillRect(x, world.floorY, pit.w, canvas.height - world.floorY);
      }

      for (const plat of platforms) {
        const x = plat.x - state.cameraX;
        ctx.fillStyle = '#c04f1e';
        ctx.fillRect(x, plat.y, plat.w, plat.h);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        for (let i = 8; i < plat.w; i += 24) {
          ctx.fillRect(x + i, plat.y + 4, 8, plat.h - 8);
        }
      }

      for (const coin of coins) {
        if (coin.got) continue;
        const x = coin.x - state.cameraX;
        const bob = Math.sin(performance.now() / 170 + coin.x) * 3;
        ctx.fillStyle = '#ffd54f';
        ctx.beginPath();
        ctx.ellipse(x, coin.y + bob, 10, 13, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        const x = enemy.x - state.cameraX;
        ctx.fillStyle = '#6d4c41';
        ctx.fillRect(x, enemy.y, enemy.w, enemy.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(x + 7, enemy.y + 8, 6, 6);
        ctx.fillRect(x + 20, enemy.y + 8, 6, 6);
      }

      const fx = world.flagX - state.cameraX;
      ctx.strokeStyle = '#f5f5f5';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(fx, world.floorY);
      ctx.lineTo(fx, 150);
      ctx.stroke();
      ctx.fillStyle = '#4caf50';
      ctx.beginPath();
      ctx.moveTo(fx, 155);
      ctx.lineTo(fx + 48, 170);
      ctx.lineTo(fx, 190);
      ctx.closePath();
      ctx.fill();

      const px = player.x - state.cameraX;
      const blink = player.invincible > 0 && Math.floor(player.invincible / 6) % 2 === 0;
      if (!blink) {
        ctx.fillStyle = '#d32f2f';
        ctx.fillRect(px, player.y, player.w, player.h);
        ctx.fillStyle = '#1565c0';
        ctx.fillRect(px, player.y + 27, player.w, player.h - 27);
        ctx.fillStyle = '#fbe9e7';
        ctx.fillRect(px + 8, player.y + 11, 20, 16);
        ctx.fillStyle = '#b71c1c';
        ctx.fillRect(px - 2, player.y, player.w + 4, 12);
      }

      if (state.gameOver || state.win) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 56px sans-serif';
        ctx.fillText(state.gameOver ? 'Game Over' : '过关成功！', canvas.width / 2, 230);
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText('按 R 重新开始', canvas.width / 2, 290);
      }
    }

    function updateHUD() {
      hud.score.textContent = `分数：${state.score}`;
      hud.coins.textContent = `金币：${state.coins}`;
      hud.lives.textContent = `生命：${state.lives}`;
      hud.stage.textContent = `关卡：${state.stage}`;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function setKey(action, value) {
      keys[action] = value;
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (['arrowleft', 'a'].includes(key)) setKey('left', true);
      if (['arrowright', 'd'].includes(key)) setKey('right', true);
      if (['arrowup', 'w', ' '].includes(key)) setKey('jump', true);
      if (key === 'r' && (state.gameOver || state.win)) resetPlayer(true);
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (['arrowleft', 'a'].includes(key)) setKey('left', false);
      if (['arrowright', 'd'].includes(key)) setKey('right', false);
      if (['arrowup', 'w', ' '].includes(key)) setKey('jump', false);
    });

    document.querySelectorAll('.btn').forEach((btn) => {
      const action = btn.dataset.key;
      const down = (ev) => { ev.preventDefault(); setKey(action, true); };
      const up = (ev) => { ev.preventDefault(); setKey(action, false); };
      btn.addEventListener('touchstart', down, { passive: false });
      btn.addEventListener('touchend', up, { passive: false });
      btn.addEventListener('touchcancel', up, { passive: false });
      btn.addEventListener('mousedown', down);
      btn.addEventListener('mouseup', up);
      btn.addEventListener('mouseleave', up);
    });

    updateHUD();
    loop();
  </script>
</body>
</html>
